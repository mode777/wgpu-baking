name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Crates linted with `clippy -D warnings`. Upstream crates are not linted (ADR-0001); new crates are added here.
  CLIPPY_CRATES: "lightbaker-web lightbaker-uv"

jobs:
  rust-native:
    name: rust-native (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - name: Toolchain (rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --workspace --locked
      - name: Unit tests (GPU tests skip without an adapter)
        run: cargo test --workspace --locked
      - name: fmt + clippy (new crates; upstream crates are not linted, ADR-0001)
        if: env.CLIPPY_CRATES != ''
        shell: bash
        run: |
          for c in $CLIPPY_CRATES; do
            cargo fmt -p "$c" --check
            cargo clippy -p "$c" --all-targets --no-deps --locked -- -D warnings
          done

  wasm:
    name: wasm (browser build)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - name: Toolchain (rust-toolchain.toml, includes wasm32-unknown-unknown)
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: Build lightbaker for wasm32 (web feature)
        run: cargo build -p lightbaker --target wasm32-unknown-unknown --no-default-features --features web --locked
      - name: lightbaker-uv builds for wasm32 (contract only; no C++ on the web)
        run: cargo build -p lightbaker-uv --target wasm32-unknown-unknown --locked
      - name: No blocking executor, threads or C compression on the web path (ADR-0003)
        shell: bash
        run: |
          deps=$(cargo tree -p lightbaker --target wasm32-unknown-unknown --no-default-features --features web -e normal --prefix none --locked)
          if echo "$deps" | grep -E '^(pollster|rayon|rayon-core|zstd|zstd-sys) '; then
            echo "::error::native-only crates in the web dependency tree"; exit 1
          fi
      - name: Engine unit tests with the web feature (host)
        run: cargo test -p lightbaker --no-default-features --features web --lib --locked
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack
      - name: Bridge clippy on wasm32
        run: cargo clippy -p lightbaker-web --target wasm32-unknown-unknown --all-targets --no-deps --locked -- -D warnings
      - name: wasm-pack build (lightbaker-web)
        run: wasm-pack build crates/lightbaker-web --target web --release
      - name: wasm-bindgen tests in Node (no WebGPU)
        run: wasm-pack test --node crates/lightbaker-web

  web:
    name: web (browser e2e on lavapipe)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - name: Install Mesa lavapipe (software Vulkan) and xvfb
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q mesa-vulkan-drivers xvfb
      - name: Toolchain (rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: js tests
        run: pnpm -C js test
      - name: Build the wasm package
        run: pnpm -C app build:wasm
      - name: Typecheck and unit tests (Vitest)
        run: |
          pnpm -C app typecheck
          pnpm -C app test
      - name: Build the app
        run: pnpm -C app build
      - name: Install Playwright's Chromium
        run: pnpm -C app exec playwright install --with-deps chromium
      - name: Browser e2e (headed under xvfb; software adapter allowed and labelled)
        env:
          E2E_HEADED: "1"
          E2E_ALLOW_FALLBACK: "1"
          # Chromium on a GPU-less runner exposes only its SwiftShader WebGPU adapter, even with lavapipe
          # installed (checked with scripts/adapter-probe.mjs, ADR-0009); the spec asserts a software adapter
          E2E_EXPECT_ADAPTER: "swiftshader|llvmpipe|lavapipe"
        run: xvfb-run -a pnpm -C app e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            app/playwright-report
            app/test-results

  rust-gpu:
    name: rust-gpu (lavapipe)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      LIGHTBAKER_REQUIRE_GPU: "1"
      LIGHTBAKER_ALLOW_SOFTWARE_ADAPTER: "1"
    steps:
      - uses: actions/checkout@v5
      - name: Install Mesa lavapipe (software Vulkan)
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q mesa-vulkan-drivers vulkan-tools
          vulkaninfo --summary || true
      - name: Toolchain (rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: GPU integration tests on lavapipe
        run: cargo test -p lightbaker --release --locked -- --nocapture
      - name: Baseline measurements (informational; software adapter timings are not representative)
        run: cargo run -p lightbaker --release --locked --example baseline -- --json baseline-lavapipe.json
      - uses: actions/upload-artifact@v4
        with:
          name: baseline-lavapipe
          path: baseline-lavapipe.json
