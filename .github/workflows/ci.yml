name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Crates linted with `clippy -D warnings`. Upstream crates are not linted (ADR-0001); new crates are added here.
  CLIPPY_CRATES: ""

jobs:
  rust-native:
    name: rust-native (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - name: Toolchain (rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --workspace --locked
      - name: Unit tests (GPU tests skip without an adapter)
        run: cargo test --workspace --locked
      - name: Clippy (new crates)
        if: env.CLIPPY_CRATES != ''
        shell: bash
        run: for c in $CLIPPY_CRATES; do cargo clippy -p "$c" --all-targets --locked -- -D warnings; done

  wasm:
    name: wasm (browser build)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - name: Toolchain (rust-toolchain.toml, includes wasm32-unknown-unknown)
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: Build lightbaker for wasm32 (web feature)
        run: cargo build -p lightbaker --target wasm32-unknown-unknown --no-default-features --features web --locked
      - name: No blocking executor, threads or C compression on the web path (ADR-0003)
        shell: bash
        run: |
          deps=$(cargo tree -p lightbaker --target wasm32-unknown-unknown --no-default-features --features web -e normal --prefix none --locked)
          if echo "$deps" | grep -E '^(pollster|rayon|rayon-core|zstd|zstd-sys) '; then
            echo "::error::native-only crates in the web dependency tree"; exit 1
          fi
      - name: Engine unit tests with the web feature (host)
        run: cargo test -p lightbaker --no-default-features --features web --lib --locked

  rust-gpu:
    name: rust-gpu (lavapipe)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      LIGHTBAKER_REQUIRE_GPU: "1"
      LIGHTBAKER_ALLOW_SOFTWARE_ADAPTER: "1"
    steps:
      - uses: actions/checkout@v5
      - name: Install Mesa lavapipe (software Vulkan)
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q mesa-vulkan-drivers vulkan-tools
          vulkaninfo --summary || true
      - name: Toolchain (rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: GPU integration tests on lavapipe
        run: cargo test -p lightbaker --release --locked -- --nocapture
      - name: Baseline measurements (informational; software adapter timings are not representative)
        run: cargo run -p lightbaker --release --locked --example baseline -- --json baseline-lavapipe.json
      - uses: actions/upload-artifact@v4
        with:
          name: baseline-lavapipe
          path: baseline-lavapipe.json
